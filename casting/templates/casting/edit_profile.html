{% extends 'casting/base.html' %}

{% block title %}Edytuj profil{% endblock %}

{% block content %}
  <h1>Edycja profilu</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Zapisz zmiany">
  </form>
  <a href="{% url 'profile' %}">Powrót do profilu</a>
{% endblock %}
