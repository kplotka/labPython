{% extends 'casting/base.html' %}

{% block title %}Edytuj ofertę: {{ offer.title }}{% endblock %}

{% block content %}
  <h1>Edytuj ofertę: {{ offer.title }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Zapisz zmiany">
    <a class="button" href="{% url 'delete_offer' offer.id %}">Usuń ofertę</a>
  </form>
  <a href="{% url 'offer_detail' offer.id %}">Powrót do szczegółów oferty</a>
{% endblock %}
