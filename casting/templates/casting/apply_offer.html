{% extends 'casting/base.html' %}

{% block title %}Aplikuj na ofertę{% endblock %}

{% block content %}
  <h1>Aplikuj na ofertę: {{ offer.title }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Wyślij aplikację">
  </form>
  <a href="{% url 'offer_detail' offer.id %}">Powrót do oferty</a>
{% endblock %}
