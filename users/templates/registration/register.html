{% extends 'base.html' %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-box">
        <h2>Załóż konto</h2>
        <form method="post">
            {% csrf_token %}

            {% for field in form %}
                <div class="field-block">
                    {{ field.label_tag }}
                    {{ field }}
                    {% if field.errors %}
                        <div class="field-error">{{ field.errors.0 }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            {% if form.non_field_errors %}
                <div class="field-error">{{ form.non_field_errors.0 }}</div>
            {% endif %}

            <button type="submit">Zarejestruj się</button>
        </form>
    </div>
</div>

<style>
.auth-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 3rem 1rem;
}

.auth-box {
    max-width: 400px;
    width: 100%;
    padding: 2rem;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.05);
}

.auth-box h2 {
    text-align: center;
    margin-bottom: 1.5rem;
    font-family: 'Playfair Display', serif;
}

.field-block {
    margin-bottom: 1rem;
}

.field-block label {
    display: block;
    font-weight: bold;
    margin-bottom: 0.25rem;
}

.field-block input {
    width: 100%;
    padding: 0.6rem;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button[type="submit"] {
    width: 100%;
    padding: 0.7rem;
    border: none;
    background-color: #d8a7b1;
    color: white;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.2s ease;
}

button[type="submit"]:hover {
    background-color: #b88c9e;
}

.field-error {
    color: crimson;
    font-size: 0.9rem;
    margin-top: 0.2rem;
}
</style>
{% endblock %}
